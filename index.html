<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copa dos Sabores | Receitas Nacionais</title>
  <link rel="stylesheet" href="style.css">

  <!-- Use Globe.gl via unpkg -->
  <script src="//unpkg.com/globe.gl"></script>
</head>

<body>

  <header>
    <div class="header-content">
      <h1>Copa dos Sabores</h1>
      <p>Descubra sabores que contam histórias<br>das nações da Copa pelo mundo.<br>Clique em um país e veja a receita.</p>
      
      <!-- Glassmorphic Search Panel -->
      <div class="search-container glass-effect">
        <div class="search-input-wrapper">
          <input type="text" id="countrySearch" placeholder="busque a receita que dá fome" autocomplete="off" aria-label="Busque países ou receitas">
          <button id="closeSearch" class="search-close-btn" aria-label="Fechar busca">&times;</button>
        </div>
        <ul id="countryList" class="country-list">
          <!-- Dynamically populated in main.js -->
        </ul>
      </div>
    </div>
  </header>

  <div id="globeViz"></div>

  <!-- Globe Controls Panel -->
  <div class="globe-controls glass-effect">
    <div class="rotation-drag-control" id="rotationDragControl" role="slider" aria-label="Girar globo" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0" tabindex="0">
      <div class="rotation-drag-track">
        <div class="rotation-drag-thumb" id="rotationDragThumb"></div>
      </div>
    </div>
    <div class="zoom-controls-row">
      <button id="zoomOut" class="control-btn" title="Zoom Out">−</button>
      <button id="zoomIn" class="control-btn" title="Zoom In">+</button>
    </div>
  </div>

  <!-- Glassmorphic Popup Modal -->
  <div id="recipeModal" class="modal hidden">
    <div class="modal-content glass-effect">
      <button id="closeModal" class="close-btn">&times;</button>
      <div class="recipe-image-container">
        <img id="recipeImage" src="" alt="Recipe Image">
      </div>
      <div class="recipe-details">
        <div class="country-header-row">
          <div class="country-title-group">
            <img id="countryFlag" src="" alt="Flag Icon">
            <h2 id="countryName">Nome do País</h2>
          </div>
        </div>
        <div id="countryTitles" class="country-titles-badges">🏆 0 títulos</div>
        <h3 id="recipeDish">Nome do Prato</h3>
        <p id="recipeDesc">A descrição aparecerá aqui.</p>
        
        <!-- Ingredients Section -->
        <div id="ingredientsSection" class="recipe-section hidden">
          <h4>Ingredientes</h4>
          <ul id="ingredientsList" class="ingredients-grid">
            <!-- Dynamically populated -->
          </ul>
        </div>

        <a id="fullRecipeCta" class="recipe-cta hidden" href="https://receitas.globo.com/" target="_blank" rel="noopener noreferrer">Venha ver a receita completa</a>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>

</html>
